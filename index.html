<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guarda em Foco - Preparatório Múltiplo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b132b;
  --panel: #1c2541;
  --panel-accent: #232f52;
  --gold: #f4c430;
  --gold-hover: #d4a318;
  --text: #f0f4f8;
  --muted: #8d99ae;
  --line: #2e3a59;
  --success: #2a9d8f;
  --error: #e63946;
  --radius: 12px;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: rgba(12, 22, 45, 0.95);
  border-bottom: 1px solid var(--line);
  padding: 16px 20px;
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.head-container {
  max-width: 1000px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  font-size: 28px;
}

h1 {
  color: #ffffff;
  font-size: 20px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.5px;
}

h1 span {
  color: var(--gold);
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin: 0;
}

main {
  max-width: 1000px;
  margin: 20px auto;
  padding: 0 20px;
  width: 100%;
  flex: 1;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.hidden { display: none !important; }

button, input {
  font-family: inherit;
  font-size: 14px;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 8px;
  padding: 12px 18px;
  font-weight: 600;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.primary {
  background: var(--gold);
  color: #0b132b;
}

.primary:hover {
  background: var(--gold-hover);
  transform: translateY(-1px);
}

.secondary {
  background: var(--panel-accent);
  color: var(--text);
  border: 1px solid var(--line);
}

.secondary:hover {
  background: #2c3a61;
  border-color: var(--muted);
}

.nav {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  overflow-x: auto;
}

.nav button {
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  padding: 10px 16px;
  border-radius: 8px;
  white-space: nowrap;
}

.nav button:hover {
  color: var(--text);
  background: var(--panel-accent);
}

.nav button.active {
  background: var(--gold);
  color: #0b132b;
  font-weight: 700;
}

.field-group {
  margin-bottom: 16px;
}

.field-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 6px;
}

.field {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #0d172e;
  color: white;
  outline: none;
  transition: border-color 0.2s;
}

.field:focus {
  border-color: var(--gold);
}

/* Auth Area styling */
.auth-wrapper {
  max-width: 420px;
  margin: 40px auto;
}

.auth-header {
  text-align: center;
  margin-bottom: 24px;
}

.auth-header h2 {
  font-size: 22px;
  margin: 0 0 8px;
}

.auth-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

.auth-links {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
}

.auth-links button {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 13px;
  padding: 0;
  text-decoration: underline;
}

.auth-links button:hover {
  color: var(--gold);
}

.message {
  padding: 12px 16px;
  border-radius: 8px;
  margin-top: 16px;
  font-size: 14px;
  border: 1px solid transparent;
}

.message.info {
  background: rgba(244, 196, 48, 0.1);
  border-color: var(--gold);
  color: var(--gold);
}

.message.error {
  background: rgba(230, 57, 70, 0.1);
  border-color: var(--error);
  color: var(--error);
}

/* Dashboard Controls */
.user-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: var(--panel-accent);
  border-radius: var(--radius);
  margin-bottom: 20px;
}

.statrow {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 16px;
}

.stat {
  background: var(--panel-accent);
  padding: 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  text-align: center;
}

.stat strong {
  display: block;
  color: var(--gold);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
}

.stat span {
  font-size: 12px;
  color: var(--muted);
}

.subjects {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  background: var(--panel-accent);
  color: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  line-height: 1.4;
}

.option:hover {
  border-color: var(--gold);
  background: #2a385c;
}

.option.correct {
  background: rgba(42, 157, 143, 0.2);
  border-color: var(--success);
  color: #4ade80;
}

.option.wrong {
  background: rgba(230, 57, 70, 0.2);
  border-color: var(--error);
  color: #f87171;
}

.progress-bar-bg {
  height: 8px;
  background: #0d172e;
  border-radius: 10px;
  overflow: hidden;
  margin: 12px 0 8px;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--gold);
  transition: width 0.3s ease;
}

.task {
  display: flex;
  align-items: center;
  padding: 12px;
  background: var(--panel-accent);
  border-radius: 8px;
  margin-bottom: 8px;
  border: 1px solid var(--line);
  cursor: pointer;
}

.task input {
  margin-right: 12px;
  accent-color: var(--gold);
  width: 18px;
  height: 18px;
}

footer {
  text-align: center;
  color: var(--muted);
  padding: 20px;
  font-size: 13px;
  border-top: 1px solid var(--line);
  margin-top: auto;
}

@media(max-width: 650px) {
  .statrow { grid-template-columns: 1fr; }
  .user-bar { flex-direction: column; gap: 10px; text-align: center; }
  main { padding: 0 12px; }
}
</style>
</head>
<body>

<header>
  <div class="head-container">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div>
        <h1>Guarda <span>em Foco</span></h1>
        <p class="subtitle">Preparatório para Guarda Municipal de Paulínia</p>
      </div>
    </div>
  </div>
</header>

<main>

  <section id="authScreen" class="auth-wrapper">
    <div class="card">
      <div class="auth-header">
        <h2 id="authTitle">Acesse sua Conta</h2>
        <p class="subtitle">Faça login para acompanhar suas metas e simul
